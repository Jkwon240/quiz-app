  out.forEach(d=>{
    const c=document.createElement('div');
    c.className='card'; c.dataset.c=d.category;
    c.innerHTML=`<div class="row1"><span class="idx">${String(d.n).padStart(3,'0')}</span>
      <span class="badge">${CATS[d.category]}</span></div>
      <div class="kr">${d.kr}</div>
      <div class="en">${d.en}</div>
      <div class="ex">${d.ex}</div>
      <button class="speak" title="발음 듣기">🔊</button>`;
    c.addEventListener('click',()=>c.classList.toggle('open'));
    c.querySelector('.speak').addEventListener('click',e=>speak(d.ex,e));
    listEl.appendChild(c);
  });
}

document.getElementById('search').addEventListener('input',e=>{q=e.target.value;render();});
tagsEl.addEventListener('click',e=>{
  const b=e.target.closest('.tag'); if(!b)return;
  document.querySelectorAll('.tag').forEach(t=>t.classList.remove('on'));
  b.classList.add('on'); cat=b.dataset.c; render();
});
const mS=document.getElementById('mStudy'), mR=document.getElementById('mRecall');
mS.addEventListener('click',()=>{document.body.classList.remove('recall');mS.classList.add('on');mR.classList.remove('on');render();});
mR.addEventListener('click',()=>{document.body.classList.add('recall');mR.classList.add('on');mS.classList.remove('on');render();});
document.getElementById('shuffle').addEventListener('click',()=>{
  for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];}
  render(); window.scrollTo({top:0,behavior:'smooth'});
});

render();
</script>
</body>
</html>
