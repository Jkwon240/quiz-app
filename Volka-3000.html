<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Volka 3000 · Word Manifest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#EAEBE4; --panel:#FFFFFF; --panel2:#F3F4ED; --line:#D6D9CF;
  --text:#1E2A27; --muted:#6F857F; --dim:#96A7A2;
  --amber:#B4483A; --amber-dim:#E1C6C0;
  --go:#2E7D5B; --stop:#C0392B;
  --board:#FAFAF7;
  --r:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--ink); color:var(--text);
  font-family:'Manrope','Noto Sans KR',system-ui,sans-serif;
  font-size:15px; line-height:1.5;
  min-height:100vh;
  padding-bottom:env(safe-area-inset-bottom);
}
button{font-family:inherit;color:inherit;border:none;background:none;cursor:pointer}
input,select{font-family:inherit}

/* ---------- manifest header ---------- */
.hdr{
  position:sticky; top:0; z-index:40;
  background:linear-gradient(180deg,var(--ink) 78%,rgba(234,235,228,.9));
  border-bottom:1px solid var(--line);
  padding:10px 14px 8px;
  backdrop-filter:blur(8px);
}
.hdr-top{display:flex;align-items:baseline;gap:10px}
.mark{
  font-family:'Barlow Condensed',sans-serif; font-weight:700;
  font-size:21px; letter-spacing:.06em; text-transform:uppercase;
  color:var(--amber);
}
.mark span{color:var(--text)}
.tagline{
  font-family:'IBM Plex Mono',monospace; font-size:10px;
  color:var(--dim); letter-spacing:.14em; text-transform:uppercase;
  margin-left:auto; white-space:nowrap;
}
.gauge{margin-top:9px;display:flex;align-items:center;gap:9px}
.gauge-bar{flex:1;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
.gauge-fill{height:100%;width:0;background:var(--amber);transition:width .45s cubic-bezier(.2,.7,.3,1)}
.gauge-txt{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:.04em}
.gauge-txt b{color:var(--amber);font-weight:600}

/* ---------- filter row ---------- */
.filters{display:flex;gap:6px;padding:9px 14px 0;flex-wrap:wrap;align-items:center}
.chip{
  font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:500;
  letter-spacing:.08em; padding:5px 10px; border-radius:999px;
  border:1px solid var(--line); color:var(--muted); background:var(--panel);
  transition:.16s;
}
.chip.on{border-color:var(--amber);color:var(--amber);background:var(--amber-dim)}
.chip small{opacity:.55;margin-left:4px;letter-spacing:0}
.spacer{flex:1}

/* ---------- board card ---------- */
.stage{padding:16px 14px 100px;max-width:620px;margin:0 auto}
.board{
  background:var(--board); border:1px solid var(--line); border-radius:var(--r);
  padding:22px 18px 18px; position:relative; overflow:hidden;
  box-shadow:0 1px 3px rgba(30,42,39,.06);
}
.board::before{
  content:''; position:absolute; inset:0; pointer-events:none;
  background:repeating-linear-gradient(180deg,transparent 0 3px,rgba(30,42,39,.014) 3px 4px);
}
.slot{
  display:flex;justify-content:space-between;align-items:center;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.14em;
  color:var(--dim);text-transform:uppercase;margin-bottom:16px;
}
.lvl-tag{color:var(--amber);border:1px solid var(--amber);padding:2px 7px;border-radius:4px}
.word{
  font-family:'Barlow Condensed',sans-serif;font-weight:600;
  font-size:clamp(40px,12vw,62px);line-height:1.02;letter-spacing:.005em;
  word-break:break-word;
}
.pos{
  font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);
  margin-top:6px;letter-spacing:.1em;
}
.flap{
  margin-top:18px;border-top:1px dashed var(--line);padding-top:16px;
  min-height:64px;
  transform-origin:top center;
}
.flap.reveal{animation:flip .34s cubic-bezier(.2,.8,.3,1)}
@keyframes flip{from{transform:rotateX(-78deg);opacity:0}to{transform:none;opacity:1}}
.mean{font-size:19px;font-weight:500;line-height:1.4;color:var(--amber)}
.mean.hidden{color:transparent!important;text-shadow:0 0 13px rgba(30,42,39,.4);user-select:none}
.ex{
  margin-top:12px;font-size:14px;color:var(--muted);line-height:1.55;
  border-left:2px solid var(--amber-dim);padding-left:11px;
}
.ex .en{color:var(--text)}
.ex .ko{display:block;margin-top:3px;font-size:13px;color:var(--dim)}
.ex-load{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);letter-spacing:.08em}

/* ---------- controls ---------- */
.row{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{
  flex:1;min-width:78px;padding:12px 10px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);
  font-size:13px;font-weight:500;letter-spacing:.01em;transition:.14s;
  display:flex;align-items:center;justify-content:center;gap:6px;
}
.btn:hover{background:var(--panel2);border-color:#B9BEB2}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--amber);color:#FFFFFF;border-color:var(--amber);font-weight:700}
.btn.go{border-color:#A9CDBB;color:var(--go)}
.btn.stop{border-color:#E3B4AE;color:var(--stop)}
.btn.small{flex:0 0 auto;min-width:0;padding:9px 13px;font-size:12px}
.btn[disabled]{opacity:.35;pointer-events:none}
.btn.on{border-color:var(--amber);color:var(--amber)}

/* ---------- quiz ---------- */
.opts{display:grid;gap:8px;margin-top:16px}
.opt{
  text-align:left;padding:14px 15px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);font-size:15px;transition:.14s;
}
.opt:hover{border-color:#B9BEB2}
.opt.correct{border-color:var(--go);background:#E9F3EE;color:var(--go)}
.opt.wrong{border-color:var(--stop);background:#FBEBE9;color:var(--stop)}
.opt .k{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-right:9px}

/* ---------- typing ---------- */
.type-in{
  width:100%;margin-top:16px;padding:14px 15px;border-radius:var(--r);
  background:var(--panel);border:1px solid var(--line);color:var(--text);
  font-size:18px;font-family:'Barlow Condensed',sans-serif;font-weight:600;letter-spacing:.02em;
}
.type-in:focus{outline:none;border-color:var(--amber)}
.verdict{margin-top:11px;font-family:'IBM Plex Mono',monospace;font-size:12px;letter-spacing:.06em}
.verdict.ok{color:var(--go)} .verdict.no{color:var(--stop)}

/* ---------- list ---------- */
.search{
  width:100%;padding:11px 13px;border-radius:var(--r);background:var(--panel);
  border:1px solid var(--line);color:var(--text);font-size:14px;margin-bottom:10px;
}
.search:focus{outline:none;border-color:var(--amber)}
.lrow{
  display:flex;align-items:center;gap:11px;padding:11px 4px;
  border-bottom:1px solid var(--line);cursor:pointer;
}
.lrow:hover{background:var(--panel)}
.lrow .w{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:19px;flex:0 0 auto}
.lrow .m{color:var(--muted);font-size:13px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .lv{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim)}
.lrow.known .w{color:var(--go)}
.count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--dim);margin-bottom:8px;letter-spacing:.06em}

/* ---------- stats ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.stat .n{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:30px;line-height:1}
.stat .l{font-family:'IBM Plex Mono',monospace;font-size:10px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin-top:5px}
.bars{margin-top:12px}
.barrow{display:flex;align-items:center;gap:9px;margin-bottom:7px;font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted)}
.barrow .t{width:22px;color:var(--amber)}
.barrow .b{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.barrow .b i{display:block;height:100%;background:var(--amber);border-radius:3px}
.barrow .v{width:76px;text-align:right;color:var(--dim)}

/* ---------- nav ---------- */
.nav{
  position:fixed;left:0;right:0;bottom:0;z-index:50;
  display:flex;background:rgba(250,250,247,.94);backdrop-filter:blur(12px);
  border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom);
}
.nav button{
  flex:1;padding:11px 3px 12px;
  font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.08em;
  color:var(--dim);text-transform:uppercase;
  border-top:2px solid transparent;margin-top:-1px;transition:.14s;
}
.nav button.on{color:var(--amber);border-top-color:var(--amber)}
.nav button i{display:block;font-style:normal;font-size:17px;margin-bottom:3px;opacity:.9}

.hide{display:none!important}
.note{font-size:12px;color:var(--dim);margin-top:12px;line-height:1.55}
.toast{
  position:fixed;left:50%;bottom:78px;transform:translateX(-50%);
  background:var(--panel2);border:1px solid var(--line);color:var(--text);
  padding:9px 15px;border-radius:999px;font-size:13px;z-index:80;
  opacity:0;pointer-events:none;transition:.22s;
}
.toast.show{opacity:1;transform:translate(-50%,-6px)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="mark">Volka <span>3000</span></div>
    <div class="tagline" id="clock">WORD MANIFEST</div>
  </div>
  <div class="gauge">
    <div class="gauge-bar"><div class="gauge-fill" id="gfill"></div></div>
    <div class="gauge-txt"><b id="gnum">0</b> / <span id="gtot">0</span> CLEARED</div>
  </div>
</header>

<div class="filters" id="filters"></div>

<main class="stage">

  <!-- STUDY -->
  <section id="v-study">
    <div class="board">
      <div class="slot"><span id="s-idx">—</span><span class="lvl-tag" id="s-lvl">A1</span></div>
      <div class="word" id="s-word">ready</div>
      <div class="pos" id="s-pos"></div>
      <div class="flap" id="s-flap">
        <div class="mean" id="s-mean">준비된</div>
        <div class="ex" id="s-ex" style="display:none"></div>
      </div>
    </div>
    <div class="row">
      <button class="btn" id="b-prev">← 이전</button>
      <button class="btn primary" id="b-say">🔊 발음</button>
      <button class="btn" id="b-next">다음 →</button>
    </div>
    <div class="row">
      <button class="btn small" id="b-mask">뜻 가리기</button>
      <button class="btn small go" id="b-known">✓ 외웠음</button>
      <button class="btn small" id="b-weak">★ 약점</button>
      <button class="btn small" id="b-ex">예문 만들기</button>
    </div>
    <div class="row">
      <button class="btn small" id="b-auto">▶︎ 자동재생</button>
      <button class="btn small" id="b-shuffle">🔀 섞기</button>
      <button class="btn small" id="b-speed">속도 1.0×</button>
    </div>
    <p class="note">자동재생: 영어 → 잠시 멈춤 → 한글 뜻 순서로 읽어줍니다. 출퇴근·크로스핏 이동 중 화면 안 봐도 됩니다.</p>
  </section>

  <!-- QUIZ -->
  <section id="v-quiz" class="hide">
    <div class="board">
      <div class="slot"><span id="q-score">0 / 0</span><span class="lvl-tag" id="q-lvl">A1</span></div>
      <div class="word" id="q-word">—</div>
      <div class="pos" id="q-pos"></div>
    </div>
    <div class="opts" id="q-opts"></div>
    <div class="row"><button class="btn small" id="q-say">🔊 다시 듣기</button><button class="btn small" id="q-skip">건너뛰기 →</button></div>
  </section>

  <!-- RECALL (typing) -->
  <section id="v-recall" class="hide">
    <div class="board">
      <div class="slot"><span id="r-score">0 / 0</span><span class="lvl-tag" id="r-lvl">A1</span></div>
      <div class="word" id="r-mean" style="font-family:'Manrope','Noto Sans KR',sans-serif;font-size:27px;font-weight:500">—</div>
      <div class="pos" id="r-pos"></div>
      <div class="flap" id="r-flap" style="min-height:0;border:none;padding-top:0"></div>
    </div>
    <input class="type-in" id="r-in" placeholder="영어로 입력…" autocomplete="off" autocapitalize="none" spellcheck="false">
    <div class="verdict" id="r-verdict"></div>
    <div class="row">
      <button class="btn" id="r-check">확인 (Enter)</button>
      <button class="btn small" id="r-hint">힌트</button>
      <button class="btn small" id="r-pass">모르겠음</button>
    </div>
  </section>

  <!-- LISTEN -->
  <section id="v-listen" class="hide">
    <div class="board" style="text-align:center;padding:34px 18px">
      <div class="slot" style="justify-content:center"><span>LISTEN &amp; PICK</span></div>
      <button class="btn primary" id="l-play" style="margin:0 auto;max-width:190px;font-size:16px;padding:16px">🔊 듣기</button>
      <div class="pos" id="l-score" style="margin-top:14px">0 / 0</div>
    </div>
    <div class="opts" id="l-opts"></div>
  </section>

  <!-- LIST -->
  <section id="v-list" class="hide">
    <input class="search" id="f-search" placeholder="단어 또는 뜻 검색…">
    <div class="row" style="margin-top:0;margin-bottom:10px">
      <button class="btn small" id="f-all">전체</button>
      <button class="btn small" id="f-todo">미완료</button>
      <button class="btn small" id="f-known">외운 단어</button>
      <button class="btn small" id="f-weak">★ 약점</button>
    </div>
    <div class="count" id="l-count"></div>
    <div id="l-rows"></div>
  </section>

  <!-- STATS -->
  <section id="v-stats" class="hide">
    <div class="grid2">
      <div class="stat"><div class="n" id="st-known">0</div><div class="l">외운 단어</div></div>
      <div class="stat"><div class="n" id="st-weak">0</div><div class="l">약점 단어</div></div>
      <div class="stat"><div class="n" id="st-acc">—</div><div class="l">정답률</div></div>
      <div class="stat"><div class="n" id="st-streak">0</div><div class="l">연속 정답</div></div>
    </div>
    <div class="bars" id="st-bars"></div>
    <div class="row">
      <button class="btn small" id="st-export">진도 내보내기</button>
      <button class="btn small" id="st-import">불러오기</button>
      <button class="btn small stop" id="st-reset">진도 초기화</button>
    </div>
    <p class="note">진도는 이 브라우저에 자동 저장됩니다. 기기를 바꿀 땐 <b>진도 내보내기</b>로 코드를 복사해서 새 기기에서 불러오세요.</p>
  </section>

</main>

<nav class="nav" id="nav">
  <button data-v="study" class="on"><i>▤</i>학습</button>
  <button data-v="quiz"><i>◆</i>퀴즈</button>
  <button data-v="recall"><i>✎</i>스펠링</button>
  <button data-v="listen"><i>♪</i>듣기</button>
  <button data-v="list"><i>≡</i>목록</button>
  <button data-v="stats"><i>▮</i>기록</button>
</nav>

<div class="toast" id="toast"></div>

<script>

/* ============ STORAGE ============ */
const store = (()=> {
  const has = (typeof window!=='undefined' && window.storage && window.storage.get);
  const mem = {};
  return {
    async get(k){
      if(has){ try{ const r=await window.storage.get(k); return r?r.value:null; }catch(e){ return null; } }
      try{ return localStorage.getItem(k); }catch(e){ return mem[k]??null; }
    },
    async set(k,v){
      if(has){ try{ await window.storage.set(k,v); return; }catch(e){} }
      try{ localStorage.setItem(k,v); }catch(e){ mem[k]=v; }
    }
  };
})();

const S = { known:{}, weak:{}, ex:{}, right:0, wrong:0, streak:0, best:0 };
const KEY = 'Volka3000:v1';
let saveT=null;
function save(){ clearTimeout(saveT); saveT=setTimeout(()=>store.set(KEY, JSON.stringify(S)), 350); }

  const raw = await store.get(KEY);
  if(raw){ try{ Object.assign(S, JSON.parse(raw)); }catch(e){} }
}

let levels = new Set(['A1','A2','B1','B2']);
let pool = [], idx = 0, masked = false, speed = 1.0, auto = false, autoT = null;
let view = 'study';
let listFilter = 'all';

const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];

function rebuild(){
  pool = WORDS.filter(x => levels.has(x.lv));
  if(!pool.length) pool = WORDS.slice();
  idx = 0;
  renderAll();
}
function cur(){ return pool[idx] || WORDS[0]; }

/* ============ TTS ============ */
let voice = null;
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  voice = vs.find(v=>/en-US/i.test(v.lang) && /Samantha|Google US|Ava|Zira/i.test(v.name))
       || vs.find(v=>/en-US/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(typeof speechSynthesis!=='undefined'){ pickVoice(); speechSynthesis.onvoiceschanged = pickVoice; }
function say(text, opt={}){
  if(typeof speechSynthesis==='undefined') return Promise.resolve();
  return new Promise(res=>{
    const u = new SpeechSynthesisUtterance(text);
    u.lang = opt.ko ? 'ko-KR' : 'en-US';
    if(!opt.ko && voice) u.voice = voice;
    u.rate = opt.ko ? 1.05 : speed;
    u.onend = res; u.onerror = res;
    speechSynthesis.speak(u);
  });
}
function sayWord(){ speechSynthesis.cancel(); say(cur().w); }

/* ============ STUDY ============ */
function renderStudy(){
  const c = cur();
  $('#s-idx').textContent = `${idx+1} / ${pool.length}`;
  $('#s-lvl').textContent = c.lv;
  $('#s-word').textContent = c.w;
  $('#s-pos').textContent = c.p ? POS[c.p]||c.p : '';
  const m = $('#s-mean');
  m.textContent = c.m;
  m.classList.toggle('hidden', masked);
  $('#b-known').classList.toggle('on', !!S.known[c.w]);
  $('#b-weak').classList.toggle('on', !!S.weak[c.w]);
  const ex = $('#s-ex');
  if(S.ex[c.w]){
    ex.style.display='';
    ex.innerHTML = `<span class="en">${esc(S.ex[c.w].en)}</span><span class="ko">${esc(S.ex[c.w].ko)}</span>`;
  } else { ex.style.display='none'; ex.innerHTML=''; }
  const f = $('#s-flap');
  f.classList.remove('reveal'); void f.offsetWidth; f.classList.add('reveal');
}
const POS = {n:'noun 명사',v:'verb 동사',adj:'adjective 형용사',adv:'adverb 부사',
  prep:'preposition 전치사',conj:'conjunction 접속사',pron:'pronoun 대명사',
  det:'determiner 한정사',num:'number 수사',phr:'phrase 표현',int:'interjection 감탄사'};

function esc(s){ return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function move(d){ idx = (idx + d + pool.length) % pool.length; renderStudy(); }

$('#b-next').onclick = ()=>move(1);
$('#b-prev').onclick = ()=>move(-1);

$('#b-speed').onclick = e=>{ speed = speed>=1.2 ? 0.75 : +(speed+0.15).toFixed(2); e.target.textContent = `속도 ${speed.toFixed(2)}×`; };

$('#b-auto').onclick = e=>{
  auto = !auto;
  e.target.textContent = auto ? '⏸ 정지' : '▶︎ 자동재생';
  e.target.classList.toggle('on', auto);
  if(auto) autoLoop(); else { clearTimeout(autoT); speechSynthesis.cancel(); }
};
async function autoLoop(){
  while(auto){
    renderStudy();
    await say(cur().w);
    if(!auto) break;
    await wait(900);
    if(!auto) break;
    await say(cur().m, {ko:true});
    if(!auto) break;
    await wait(500);
    idx = (idx+1) % pool.length;
  }
}
const wait = ms => new Promise(r=>{ autoT = setTimeout(r, ms); });

      body: JSON.stringify({

`Write ONE short natural English example sentence (max 12 words) using the word "${c.w}" (${c.lv} level, meaning: ${c.m}), plus its Korean translation.

  $('#q-opts').innerHTML = opts.map((o,i)=>
    `<button class="opt" data-w="${esc(o.w)}"><span class="k">${'ABCD'[i]}</span>${esc(o.m)}</button>`).join('');
  $$('#q-opts .opt').forEach(b=> b.onclick = ()=>answerQuiz(b));
  say(qw.w);
}
function answerQuiz(btn){
  if(qLock) return; qLock=true;
  const ok = btn.dataset.w === qw.w;
  btn.classList.add(ok?'correct':'wrong');
  if(!ok) $$('#q-opts .opt').find(b=>b.dataset.w===qw.w)?.classList.add('correct');
  score(ok, qw.w);
  $('#q-score').textContent = `${S.right} / ${S.right+S.wrong}`;
  setTimeout(newQuiz, ok?680:1500);
}
$('#q-say').onclick = ()=> qw && say(qw.w);
$('#q-skip').onclick = ()=> newQuiz();

function pick(){
  const weak = pool.filter(x=>S.weak[x.w]);
  const todo = pool.filter(x=>!S.known[x.w]);
  const src = (weak.length && Math.random()<0.35) ? weak : (todo.length? todo : pool);
  return src[(Math.random()*src.length)|0];
}
function sample(n, not){
  const out=[], seen=new Set([not.w]);
  let guard=0;
  while(out.length<n && guard++<400){
    const c = pool[(Math.random()*pool.length)|0];
    if(seen.has(c.w)) continue;
    seen.add(c.w); out.push(c);
  }
  return out;
}
function score(ok, w){
  if(ok){ S.right++; S.streak++; S.best=Math.max(S.best,S.streak); if(S.weak[w]) delete S.weak[w]; }
  else { S.wrong++; S.streak=0; S.weak[w]=1; }
  save();
}

/* ============ RECALL ============ */
let rw=null;
function newRecall(){
  rw = pick();
  $('#r-mean').textContent = rw.m;
  $('#r-lvl').textContent = rw.lv;
  $('#r-pos').textContent = rw.p ? POS[rw.p]||rw.p : '';
  $('#r-score').textContent = `${S.right} / ${S.right+S.wrong}`;
  $('#r-flap').textContent = '';
  $('#r-in').value=''; $('#r-verdict').textContent='';
  $('#r-in').focus();
}
function checkRecall(){
  if(!rw) return;
  const v = $('#r-in').value.trim().toLowerCase();
  if(!v) return;
  const ok = v === rw.w.toLowerCase();
  score(ok, rw.w);
  const el = $('#r-verdict');
  el.className = 'verdict ' + (ok?'ok':'no');
  el.textContent = ok ? '✓ 정답' : `✗ 정답: ${rw.w}`;
  $('#r-flap').innerHTML = `<div class="word" style="font-size:34px">${esc(rw.w)}</div>`;
  say(rw.w);
  setTimeout(newRecall, ok?900:2100);
}
$('#r-check').onclick = checkRecall;
$('#r-in').addEventListener('keydown', e=>{ if(e.key==='Enter') checkRecall(); });
$('#r-hint').onclick = ()=>{
  if(!rw) return;
  const n = Math.max(1, Math.ceil(rw.w.length/3));
  $('#r-flap').innerHTML = `<div class="pos">${esc(rw.w.slice(0,n))}${'·'.repeat(rw.w.length-n)}</div>`;
};
$('#r-pass').onclick = ()=>{ if(!rw) return; score(false, rw.w); $('#r-verdict').className='verdict no'; $('#r-verdict').textContent=`정답: ${rw.w}`; say(rw.w); setTimeout(newRecall,1600); };

/* ============ LISTEN ============ */
let lw=null, lLock=false;
function newListen(){
  lLock=false;
  lw = pick();
  $('#l-score').textContent = `${S.right} / ${S.right+S.wrong}`;
  const opts = [lw, ...sample(3, lw)].sort(()=>Math.random()-.5);
  $('#l-opts').innerHTML = opts.map(o=>
    `<button class="opt" data-w="${esc(o.w)}"><b style="font-family:'Barlow Condensed',sans-serif;font-size:19px">${esc(o.w)}</b> <span style="color:var(--dim);font-size:13px">${esc(o.m)}</span></button>`).join('');
  $$('#l-opts .opt').forEach(b=> b.onclick = ()=>{
    if(lLock) return; lLock=true;
    const ok = b.dataset.w===lw.w;
    b.classList.add(ok?'correct':'wrong');
    if(!ok) $$('#l-opts .opt').find(x=>x.dataset.w===lw.w)?.classList.add('correct');
    score(ok, lw.w);
    setTimeout(newListen, ok?700:1500);
  });
  setTimeout(()=>say(lw.w), 220);
}
$('#l-play').onclick = ()=> lw && say(lw.w);

/* ============ LIST ============ */
function renderList(){
  const q = $('#f-search').value.trim().toLowerCase();
  let rows = pool;
  if(listFilter==='known') rows = rows.filter(x=>S.known[x.w]);
  if(listFilter==='todo')  rows = rows.filter(x=>!S.known[x.w]);
  if(listFilter==='weak')  rows = rows.filter(x=>S.weak[x.w]);
  if(q) rows = rows.filter(x=> x.w.toLowerCase().includes(q) || x.m.includes(q));
  $('#l-count').textContent = `${rows.length.toLocaleString()} WORDS`;
  const slice = rows.slice(0,400);
  $('#l-rows').innerHTML = slice.map(x=>
    `<div class="lrow ${S.known[x.w]?'known':''}" data-w="${esc(x.w)}">
       <span class="w">${esc(x.w)}</span>
       <span class="m">${esc(x.m)}</span>
       ${S.weak[x.w]?'<span class="lv" style="color:var(--stop)">★</span>':''}
       <span class="lv">${x.lv}</span>
     </div>`).join('') + (rows.length>400?`<div class="note">첫 400개만 표시했습니다. 검색으로 좁혀보세요.</div>`:'');
  $$('#l-rows .lrow').forEach(r=> r.onclick = ()=>{
    const w = r.dataset.w;
    const i = pool.findIndex(x=>x.w===w);
    if(i>=0){ idx=i; switchView('study'); }
    say(w);
  });
}
$('#f-search').addEventListener('input', renderList);
[['f-all','all'],['f-todo','todo'],['f-known','known'],['f-weak','weak']].forEach(([id,f])=>{
  $('#'+id).onclick = ()=>{ listFilter=f; $$('#v-list .btn.small').forEach(b=>b.classList.remove('on')); $('#'+id).classList.add('on'); renderList(); };
});

/* ============ STATS ============ */
function renderStats(){
  const k = Object.keys(S.known).length;
  $('#st-known').textContent = k.toLocaleString();
  $('#st-weak').textContent = Object.keys(S.weak).length;
  const tot = S.right+S.wrong;
  $('#st-acc').textContent = tot ? Math.round(S.right/tot*100)+'%' : '—';
  $('#st-streak').textContent = S.streak + (S.best?` / ${S.best}`:'');
  $('#st-bars').innerHTML = ['A1','A2','B1','B2'].map(lv=>{
    const all = WORDS.filter(x=>x.lv===lv);
    const done = all.filter(x=>S.known[x.w]).length;
    const pct = all.length? done/all.length*100 : 0;
    return `<div class="barrow"><span class="t">${lv}</span><span class="b"><i style="width:${pct}%"></i></span><span class="v">${done}/${all.length}</span></div>`;
  }).join('');
}
$('#st-reset').onclick = ()=>{
  if(!confirm('외운 단어·약점·정답률 기록이 모두 지워집니다. 계속할까요?')) return;
  S.known={}; S.weak={}; S.ex={}; S.right=0; S.wrong=0; S.streak=0; S.best=0;
  save(); renderAll(); toast('진도를 초기화했습니다');
};
$('#st-export').onclick = ()=>{
  const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
  prompt('아래 코드를 복사해서 다른 기기에서 불러오기 하세요:', code);
};
$('#st-import').onclick = ()=>{
  const code = prompt('내보내기 코드를 붙여넣으세요:');
  if(!code) return;
  try{ Object.assign(S, JSON.parse(decodeURIComponent(escape(atob(code.trim()))))); save(); renderAll(); toast('진도를 불러왔습니다'); }
  catch(e){ toast('코드를 읽을 수 없습니다'); }
};

/* ============ SHELL ============ */
function gauge(){
  const k = pool.filter(x=>S.known[x.w]).length;
  $('#gnum').textContent = k.toLocaleString();
  $('#gtot').textContent = pool.length.toLocaleString();
  $('#gfill').style.width = (pool.length? k/pool.length*100 : 0)+'%';
}
function renderAll(){ gauge(); renderStudy(); renderList(); renderStats(); }

function switchView(v){
  view = v;
  auto = false; clearTimeout(autoT); speechSynthesis.cancel();
  $('#b-auto').textContent='▶︎ 자동재생'; $('#b-auto').classList.remove('on');
  ['study','quiz','recall','listen','list','stats'].forEach(x=> $('#v-'+x).classList.toggle('hide', x!==v));
  $$('#nav button').forEach(b=> b.classList.toggle('on', b.dataset.v===v));
  if(v==='quiz') newQuiz();
  if(v==='recall') newRecall();
  if(v==='listen') newListen();
  if(v==='list') renderList();
  if(v==='stats') renderStats();
  if(v==='study') renderStudy();
  window.scrollTo({top:0});
}
$$('#nav button').forEach(b=> b.onclick = ()=>switchView(b.dataset.v));

function buildFilters(){
  const f = $('#filters');
  f.innerHTML = ['A1','A2','B1','B2'].map(lv=>{
    const n = WORDS.filter(x=>x.lv===lv).length;
    return `<button class="chip on" data-lv="${lv}">${lv}<small>${n}</small></button>`;
  }).join('') + `<span class="spacer"></span><button class="chip" id="only-todo">미완료만</button>`;
  $$('#filters .chip[data-lv]').forEach(c=> c.onclick = ()=>{
    const lv = c.dataset.lv;
    levels.has(lv) ? levels.delete(lv) : levels.add(lv);
    if(!levels.size) levels.add(lv);
    $$('#filters .chip[data-lv]').forEach(x=> x.classList.toggle('on', levels.has(x.dataset.lv)));
    rebuild();
  });
  $('#only-todo').onclick = e=>{
    e.target.classList.toggle('on');
    rebuild();
    if(e.target.classList.contains('on')){
      pool = pool.filter(x=>!S.known[x.w]);
      if(!pool.length){ pool = WORDS.filter(x=>levels.has(x.lv)); toast('미완료 단어가 없습니다'); e.target.classList.remove('on'); }
      idx=0; renderAll();
    }
  };
}

let toastT;
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1900);
}

document.addEventListener('keydown', e=>{
  if(e.target.tagName==='INPUT') return;
  if(view!=='study') return;
  if(e.key==='ArrowRight'){ move(1); }
  if(e.key==='ArrowLeft'){ move(-1); }
  if(e.key===' '){ e.preventDefault(); sayWord(); }
});

$('#clock').textContent = `${WORDS.length.toLocaleString()} ENTRIES`;

(async ()=>{ await load(); buildFilters(); rebuild(); })();
</script>
</body>
</html>
